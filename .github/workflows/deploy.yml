name: Deploy

# Deploys the built site to Cloudflare Pages on every push to main.
# No-ops (succeeds) until the Cloudflare secrets are configured, so it never
# shows a red failure before the project is wired up:
#   Settings > Secrets and variables > Actions:
#     CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#     VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare config
        id: guard
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not set — skipping deploy (this is expected until configured)."
          fi
      - uses: actions/checkout@v6
        if: steps.guard.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.ready == 'true'
      - name: Build
        if: steps.guard.outputs.ready == 'true'
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Publish to Cloudflare Pages
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=groundskeeper
