name: Bug report
description: Something isn't working as expected
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. See ...
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - geometry
        - map / calibration
        - survey / GPS
        - sync / auth / offline
        - HA export
        - other
  - type: input
    id: device
    attributes:
      label: Device / browser
      placeholder: iPhone 15 Safari / desktop Chrome
